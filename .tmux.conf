# session management
set -g exit-unattached on           # close session when last client detaches
set -g destroy-unattached on        # destroy session when last client detaches
set -g renumber-windows on          # renumber windows when one is closed

# terminal settings
set -g default-terminal "xterm-256color"
set-option -g focus-events on       # pass through focus events to applications
set -sg escape-time 0               # no delay for escape key press
set -g history-limit 5000           # scrollback buffer size

# key bindings
## general
set -g prefix `                     # prefix key
bind-key ` last-window              # double-tap prefix to switch to last window
bind-key Tab last-window            # alternative last-window shortcut
bind-key e send-prefix              # for nested tmux sessions
bind r source-file ~/.tmux.conf     # reload tmux config

## window management
unbind x
bind x new-window -a -c "#{pane_current_path}"  # create new window in current path
bind -n S-Left  previous-window     # shift+left to go to previous window
bind -n S-Right next-window         # shift+right to go to next window

## pane management 
bind-key v split-window -h -c "#{pane_current_path}"  # split vertically
bind-key s split-window -v -c "#{pane_current_path}"  # split horizontally

## vim-style navigation
bind h select-pane -L               # left
bind j select-pane -D               # down
bind k select-pane -U               # up
bind l select-pane -R               # right

## vim-style resizing
bind-key J resize-pane -D 5         # resize down
bind-key K resize-pane -U 5         # resize up
bind-key H resize-pane -L 5         # resize left
bind-key L resize-pane -R 5         # resize right

## other bindings
bind -n C-k send-keys C-l\; clear-history  # clear history

# input mode settings
set -g status-keys vi               # vi-style key bindings in status line
setw -g mode-keys vi                # vi-style key bindings in copy mode
set -g mouse on                     # enable mouse support

# clipboard integration
## general settings
set-option -g set-clipboard on      # use system clipboard

## mouse selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy -i"

## word selection (double-click)
bind-key -T copy-mode-vi DoubleClick1Pane \
    select-pane \; \
    send-keys -X select-word-no-clear \; \
    send-keys -X copy-pipe-and-cancel "pbcopy -i" \; \
    send-keys -X cancel
bind-key -n DoubleClick1Pane \
    select-pane \; \
    copy-mode -M \; \
    send-keys -X select-word \; \
    send-keys -X copy-pipe-and-cancel "pbcopy -i" \; \
    send-keys -X cancel

## line selection (triple-click)
bind-key -T copy-mode-vi TripleClick1Pane \
    select-pane \; \
    send-keys -X select-line \; \
    send-keys -X copy-pipe-no-clear "pbcopy -i"
bind-key -n TripleClick1Pane \
    select-pane \; \
    copy-mode -M \; \
    send-keys -X select-line \; \
    send-keys -X copy-pipe-no-clear "pbcopy -i"

# visual appearance
## status bar
set -g status on
set -g status-style bg=default,fg=white
set -g status-interval 60           # update status every 60 seconds
set -g status-left-length 30
set -g status-left ''
set -g status-justify left
set -g status-right ' #(whoami)@#H '

## window formatting
set -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour1]#F '
set -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
